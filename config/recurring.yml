production:
  # home_feed_entries（キャッシュDB）の無限成長を防ぐ定期トリム
  trim_home_feed:
    class: TrimHomeFeedJob
    queue: default
    schedule: at 4am every day

  # 期限切れのリモートメディアキャッシュ(R2)と孤児blobの削除。
  # 毎時少しずつ処理する(定常状態は1回数十件で数秒。溜まった分も1日程度で解消)
  cache_cleanup:
    class: CacheCleanupJob
    queue: low_priority
    schedule: every hour
